<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ocean Breath Day & Night</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050814;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .title {
      position: absolute;
      top: 28px;
      left: 30px;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.04em;
    }

    .title h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 500;
    }

    .title p {
      margin: 8px 0 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      max-width: 360px;
    }

    .hint {
      position: absolute;
      left: 30px;
      bottom: 24px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      letter-spacing: 0.03em;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="title">
      <h1>Ocean Breath</h1>
      <p>Click to enable microphone. The sun sets, the moon rises, and the sea responds to your voice.</p>
    </div>
    <div class="hint">Click to start audio</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
